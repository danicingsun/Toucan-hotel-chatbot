version: "3.1"

rules:

# --------------------------------------------------
# Start booking
# --------------------------------------------------
- rule: Start booking
  condition:
    - active_loop: null
  steps:
    - intent: book_hotel
    - action: booking_form
    - active_loop: booking_form

# --------------------------------------------------
# Continue filling form
# --------------------------------------------------
- rule: Continue booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form


# --------------------------------------------------
# Cancel booking while form is active
# --------------------------------------------------
- rule: Cancel booking while form is active
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_deactivate_loop
    - action: action_cancel_booking

# --------------------------------------------------
# Confirm booking after summary
# --------------------------------------------------
- rule: Confirm booking
  condition: 
    - active_loop: null 
  steps:
    - intent: affirm
    - action: action_submit_booking_confirmed

# --------------------------------------------------
# Deny booking after summary
# --------------------------------------------------
- rule: Deny booking
  condition: 
    - active_loop: null
  steps:
    - intent: deny
    - action: action_cancel_booking