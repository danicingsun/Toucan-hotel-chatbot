version: "3.1"

# --------------------------------------------------
# Start booking
# --------------------------------------------------
- rule: Activate booking form
  steps:
    - intent: book_hotel
    - action: booking_form
    - active_loop: booking_form

# --------------------------------------------------
# Handle change DURING form
# --------------------------------------------------
- rule: Change booking during form
  condition:
    - active_loop: booking_form
  steps:
    - intent: change_booking
    - action: action_handle_change
    - action: booking_form
    - active_loop: booking_form

# --------------------------------------------------
# Submit booking
# --------------------------------------------------
- rule: Submit booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form
    - active_loop: null
    - action: action_submit_booking_confirmed

# --------------------------------------------------
# Change non-existing booking
# --------------------------------------------------
- rule: Change booking without active form
  condition:
    - active_loop: null
  steps:
    - intent: change_booking
    - action: utter_no_active_booking

# --------------------------------------------------
# Cancel booking
# --------------------------------------------------
- rule: Cancel booking mid-form
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_cancel_booking