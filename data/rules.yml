version: "3.1"

rules:

- rule: Activate booking form
  steps:
    - intent: book_hotel
    - action: booking_form
    - active_loop: booking_form

- rule: Submit booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form
    - active_loop: null
    - action: utter_summary

- rule: Confirm booking
  steps:
    - intent: affirm
    - action: action_submit_booking   # confirms + resets slots

- rule: Deny booking after summary
  steps:
    - intent: deny
    - action: action_cancel_booking

- rule: Cancel booking while form is active
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_cancel_booking
    - action: action_deactivate_loop
    - active_loop: null

- rule: Cancel with no active booking
  condition:
  - active_loop: null
  steps:
  - intent: stop
  - action: utter_no_active_booking 

- rule: Out of scope during booking
  condition:
    - active_loop: booking_form
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope
    - action: booking_form
    - active_loop: booking_form
