version: "3.1"

rules:

# -------------------------------------------------- 
# Activate booking form 
# --------------------------------------------------
- rule: Activate booking form
  steps:
    - intent: book_hotel
    - action: booking_form
    - active_loop: booking_form

# -------------------------------------------------- 
# Submit form 
# -------------------------------------------------- 
- rule: Submit booking form 
  condition: 
    - active_loop: booking_form 
  steps: 
    - action: booking_form
    - active_loop: null
    - action: action_submit_booking_confirmed

# -------------------------------------------------- 
# Cancel form 
# --------------------------------------------------
- rule: Cancel booking during form
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_cancel_booking

# --------------------------------------------------
# Ask what to change
# --------------------------------------------------
- rule: Ask what to change
  steps:
    - intent: change_booking
    - action: action_handle_booking_change

# --------------------------------------------------
# Apply booking field change
# --------------------------------------------------
- rule: Change booking after form
  steps:
    - intent: select_booking_field
    - action: action_handle_booking_change