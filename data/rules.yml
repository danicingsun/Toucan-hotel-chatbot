version: "3.1"

rules:

# --------------------------------------------------
# Start booking (ONLY if not already active)
# --------------------------------------------------
- rule: Start booking
  condition:
    - active_loop: null
    - slot_was_set:
        - booking_blocked: false
  steps:
    - intent: book_hotel
    - action: booking_form
    - active_loop: booking_form

# --------------------------------------------------
# Restart booking after being blocked (explicit user intent)
# --------------------------------------------------
- rule: Restart blocked booking
  steps:
    - intent: book_hotel
    - action: action_clear_booking_block
    - action: booking_form
    - active_loop: booking_form

# --------------------------------------------------
# Submit form → show summary
# --------------------------------------------------
- rule: Submit booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form
    - active_loop: null
    - action: action_submit_booking


# --------------------------------------------------
# Confirm booking after summary
# --------------------------------------------------
- rule: Confirm booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: affirm
    - action: action_submit_booking_confirmed


# --------------------------------------------------
# Deny booking after summary
# --------------------------------------------------
- rule: Deny booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: deny
    - action: action_cancel_booking


# --------------------------------------------------
# Cancel while filling the form
# --------------------------------------------------
- rule: Cancel booking while form is active
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_cancel_booking