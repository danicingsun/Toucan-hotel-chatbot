version: "3.1"

rules:

# -------------------------------------------------- 
# Activate booking form # --------------------------------------------------
- rule: Activate booking form
  steps:
    - intent: book_hotel
    - action: booking_form
    - active_loop: booking_form

# -------------------------------------------------- 
# Continue form 
# -------------------------------------------------- 
- rule: Continue booking form 
  condition: 
    - active_loop: booking_form 
  steps: 
    - action: booking_form

# --------------------------------------------------
# Cancel booking while form is active
# --------------------------------------------------
- rule: Cancel booking while form is active
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_deactivate_loop
    - action: action_cancel_booking
