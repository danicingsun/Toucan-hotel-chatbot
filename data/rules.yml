version: "3.1"

rules:

# --------------------------------------------------
# Start booking
# --------------------------------------------------
- rule: Start booking
  condition:
    - active_loop: null
  steps:
    - intent: book_hotel
    - action: booking_form  # this activates the form

# --------------------------------------------------
# Submit booking when form is complete
# --------------------------------------------------
- rule: Submit booking
  condition:
    - active_loop: booking_form
  steps:
    - action: action_submit_booking
    - action: action_submit_booking_confirmed  # this ends the form

# --------------------------------------------------
# Continue booking form
# --------------------------------------------------
- rule: Continue booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form  # simply resumes the form

# --------------------------------------------------
# Stop booking while form is active
# --------------------------------------------------
- rule: Cancel booking while form is active
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_cancel_booking  # clears the form

# --------------------------------------------------
# Confirm booking after summary
# --------------------------------------------------
- rule: Confirm booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: affirm
    - action: action_submit_booking_confirmed  # clears loop

# --------------------------------------------------
# Deny booking after summary
# --------------------------------------------------
- rule: Deny booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: deny
    - action: action_cancel_booking  # clears loop