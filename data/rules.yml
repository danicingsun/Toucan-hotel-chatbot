version: "3.1"

rules:

# --------------------------------------------------
# Start booking 
# --------------------------------------------------
- rule: Start booking
  condition:
    - active_loop: null
  steps:
    - intent: book_hotel
    - action: booking_form
    - active_loop: booking_form

# --------------------------------------------------
# Submit booking
# --------------------------------------------------
- rule: Submit booking form 
  condition: 
    - active_loop: booking_form 
  steps: 
    - action: booking_form 
    - active_loop: booking_form

- rule: Show booking summary after form
  steps:
    - action: action_submit_booking


# --------------------------------------------------
# Cancel booking while form is active
# --------------------------------------------------
- rule: Cancel booking while form is active
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_cancel_booking
    - active_loop: null

# --------------------------------------------------
# Confirm booking after summary
# --------------------------------------------------
- rule: Confirm booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: affirm
    - action: action_submit_booking_confirmed

# --------------------------------------------------
# Deny booking after summary
# --------------------------------------------------
- rule: Deny booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: deny
    - action: action_clear_booking_slots
    - action: action_cancel_booking
    - active_loop: null