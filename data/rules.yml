version: "3.1"

rules:

# --------------------------------------------------
# Start booking
# --------------------------------------------------
- rule: Start booking
  condition:
    - active_loop: null
  steps:
    - intent: book_hotel
    - action: booking_form
    - active_loop: booking_form

# --------------------------------------------------
# Continue filling form
# --------------------------------------------------
- rule: Continue booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form

# --------------------------------------------------
# Submit form
# --------------------------------------------------
- rule: Submit booking form 
  condition: 
    - active_loop: booking_form 
  steps: 
    - action: booking_form 
    - active_loop: null 

# --------------------------------------------------
# Cancel booking while form is active
# --------------------------------------------------
- rule: Cancel booking while form is active
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_cancel_booking
    - active_loop: null

# --------------------------------------------------
# Confirm booking after summary
# --------------------------------------------------
- rule: Confirm booking
  steps:
    - intent: affirm
    - action: action_submit_booking_confirmed
    - active_loop: null

# --------------------------------------------------
# Deny booking after summary
# --------------------------------------------------
- rule: Deny booking
  steps:
    - intent: deny
    - action: action_cancel_booking
    - active_loop: null