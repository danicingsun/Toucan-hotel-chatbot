version: "3.6"

rules:

# --------------------------------------------------
# Start booking (ONLY if not already active)
# --------------------------------------------------
- rule: Activate booking form
  steps:
    - intent: book_hotel
    - action: action_start_booking
    - active_loop: booking_form


# --------------------------------------------------
# Submit form → show summary
# --------------------------------------------------
- rule: Submit booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form
    - active_loop: null
    - action: action_submit_booking


# --------------------------------------------------
# Confirm booking after summary
# --------------------------------------------------
- rule: Confirm booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: affirm
    - action: action_submit_booking_confirmed


# --------------------------------------------------
# Deny booking after summary
# --------------------------------------------------
- rule: Deny booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: deny
    - action: action_cancel_booking


# --------------------------------------------------
# Cancel while filling the form
# --------------------------------------------------
- rule: Cancel booking during form
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_cancel_booking
    - active_loop: null