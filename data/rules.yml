version: "3.1"

rules:

# Start booking
- rule: Activate booking form
  steps:
    - intent: book_hotel
    - action: booking_form
    - active_loop: booking_form


# Submit booking form
- rule: Submit booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form
    - active_loop: null
    - action: action_submit_booking


# Confirm booking ONLY after summary
- rule: Confirm booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: affirm
    - action: action_submit_booking_confirmed


# Deny booking AFTER summary
- rule: Deny booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: deny
    - action: action_cancel_booking
    - active_loop: null


# Cancel booking DURING form
- rule: Cancel booking while form active
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_cancel_booking
    - active_loop: null