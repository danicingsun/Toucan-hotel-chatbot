version: "3.1"

rules:

# --------------------------------------------------
# Start booking if not blocked and form inactive
# --------------------------------------------------
- rule: Start booking
  condition:
    - active_loop: null
    - slot_was_set:
        - booking_blocked: false
  steps:
    - intent: book_hotel
    - action: action_clear_booking_slots
    - action: booking_form
    - active_loop: booking_form

# --------------------------------------------------
# Cancel booking while form is active
# --------------------------------------------------
- rule: Cancel booking while form is active
  condition:
    - active_loop: booking_form
  steps:
    - intent: stop
    - action: action_cancel_booking
    - active_loop: null
    - action: action_clear_booking_slots
    - slot_was_set:
        - booking_blocked: true

# --------------------------------------------------
# Submit form → show summary
# --------------------------------------------------
- rule: Submit booking form
  condition:
    - active_loop: booking_form
  steps:
    - action: booking_form
    - active_loop: null
    - action: action_submit_booking

# --------------------------------------------------
# Confirm booking after summary
# --------------------------------------------------
- rule: Confirm booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: affirm
    - action: action_submit_booking_confirmed
    - slot_was_set:
        - booking_blocked: false

# --------------------------------------------------
# Deny booking after summary
# --------------------------------------------------
- rule: Deny booking
  condition:
    - slot_was_set:
        - booking_ready: true
  steps:
    - intent: deny
    - action: action_clear_booking_slots
    - action: action_cancel_booking
    - active_loop: null
    - slot_was_set:
        - booking_blocked: true

# --------------------------------------------------
# Restart booking after cancel
# --------------------------------------------------
- rule: Restart booking after cancel
  steps:
    - intent: book_hotel
    - action: action_clear_booking_slots
    - slot_was_set:
        - booking_blocked: false
    - action: booking_form
    - active_loop: booking_form