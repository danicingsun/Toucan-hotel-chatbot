version: "3.1"

intents:
  - book_hotel
  - change_booking
  - affirm
  - deny
  - greet
  - stop

entities:
  - booking_field

slots:
  name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: name

  checkin:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: checkin

  checkout:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: checkout

  guests:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: guests

  room_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: room_type

  breakfast:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: breakfast

  payment:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: payment

  refund:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: refund

  email:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: booking_form
            requested_slot: email

  confirmation: 
    type: text 
    influence_conversation: false 
    mappings: 
      - type: from_intent 
        intent: affirm 
        value: "yes" 
        conditions: 
          - active_loop: booking_form 
            requested_slot: confirmation 
      - type: from_intent 
        intent: deny 
        value: "no" 
        conditions: 
          - active_loop: booking_form 
            requested_slot: confirmation

  booking_field:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: booking_field

forms:
  booking_form:
    ignored_intents:
      - stop
      - change_booking
    required_slots:
      - name
      - checkin
      - checkout
      - guests
      - room_type
      - breakfast
      - payment
      - refund
      - email
      - confirmation

responses:
  utter_greet:
    - text: "Hello! How can I help you today?"

  utter_ask_booking_form_name:
    - text: "What is the guest name for the booking?"

  utter_ask_booking_form_checkin:
    - text: "It's nice to chat with you {name}. What is your check-in date? (YYYY-MM-DD)"

  utter_ask_booking_form_checkout:
    - text: "What is your check-out date? (YYYY-MM-DD)"

  utter_ask_booking_form_guests:
    - text: "How many guests will be staying?"

  utter_ask_booking_form_room_type:
    - text: "What type of room would you prefer {name}? (single, double, triple, suite)"

  utter_ask_booking_form_breakfast:
    - text: "Would you like breakfast included {name}? (yes/no)"
      buttons:
        - title: "✅ YES"
          payload: "yes"
        - title: "❌ NO"
          payload: "no"

  utter_ask_booking_form_payment:
    - text: "What payment method do you prefer {name}? (credit card / cash)"
      buttons:
        - title: "Credit card"
          payload: "credit card"
        - title: "Cash"
          payload: "cash"

  utter_ask_booking_form_refund:
    - text: "Do you prefer a refundable or non-refundable rate?"
      buttons:
        - title: "Refundable"
          payload: "refundable"
        - title: "Non-refundable"
          payload: "non-refundable"

  utter_ask_booking_form_email: 
    - text: "{name}, could you please provide email address?"

  utter_ask_booking_form_confirmation:
    - text: |
        Here is your booking summary:
        • Name: {name}
        • Check-in: {checkin}
        • Check-out: {checkout}
        • Guests: {guests}
        • Room type: {room_type}
        • Breakfast: {breakfast}
        • Payment: {payment}
        • Refund policy: {refund}
        • Email address: {email}

        Would you like to confirm the booking?
      buttons:
        - title: "✅ Confirm"
          payload: "/affirm"
        - title: "❌ Cancel"
          payload: "/deny"

  utter_no_active_booking:
    - text: "You don’t have an active booking to change."

  utter_cancel_booking:
    - text: "Your booking has been cancelled. All details were cleared."


actions:
  - validate_booking_form
  - action_submit_booking_confirmed
  - action_cancel_booking
  - action_handle_change 
  - action_send_confirmation_email